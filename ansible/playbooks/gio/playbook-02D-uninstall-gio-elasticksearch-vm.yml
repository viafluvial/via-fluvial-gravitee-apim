---
- name: Desinstalar e limpar configurações do Banco de dados Elasticsearch da Plataforma GIO no Docker Swarm
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/elasticsearch"
    # Segurança: por padrão NÃO remove o diretório com dados.
    # Para remover também os dados, execute com: -e gio_remove_data_directories=true
    gio_remove_data_directories: false

  tasks:

    ### BLOCO 1: Remoção da Stack ###
    - name: Remover stack do Docker para GIO Elasticsearch
      shell: docker stack rm gio_elasticsearch
      ignore_errors: true

    - name: Aguardar até que os serviços da stack GIO Elasticsearch sejam removidos
      shell: |
        until [ -z "$(docker stack services gio_elasticsearch 2>/dev/null | grep -v NAME)" ]; do
          echo "Aguardando remoção da stack..."
          sleep 5
        done
      args:
        executable: /bin/bash
      register: stack_removal_status
      ignore_errors: true

    - name: Mostrar status da remoção da stack
      debug:
        msg: "{{ stack_removal_status.stdout_lines | default(['Stack removida ou não encontrada.']) }}"

    ### BLOCO 2: Permissões para Deletar ###
    - name: Ajustar permissões para permitir remoção da pasta
      file:
        path: "{{ gio_directory }}"
        state: directory
        recurse: yes
        mode: '0777'
        owner: root
        group: root
      ignore_errors: true
      when: gio_remove_data_directories | bool

    ### BLOCO 3: Remoção do Diretório ###
    - name: Remover diretório completo do GIO Elasticsearch
      file:
        path: "{{ gio_directory }}"
        state: absent
      when: gio_remove_data_directories | bool
