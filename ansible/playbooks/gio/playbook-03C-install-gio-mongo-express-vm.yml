---
- name: Instalar e configurar o Mongo Express com Docker Stack (GIO)
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/mongo-express"
    env_file_local_path: "{{ playbook_dir }}/.env.mongo-express"
    env_file_remote_path: "{{ gio_directory }}/.env"
    compose_file_name: "docker-compose.yml"
    compose_file_src: "{{ playbook_dir }}/../../../applications/gio/repository/repository-gio-mongo-express-docker-compose.yml"

  tasks:

  ### BLOCO 1: Verificações iniciais no host remoto
  - name: Verificar se Docker está instalado
    command: docker --version
    register: docker_version
    failed_when: docker_version.rc != 0

  - name: Verificar se Docker Swarm está ativo
    command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
    register: swarm_state
    failed_when: swarm_state.stdout != "active"

  ### BLOCO 2: Obter IP do host remoto
  - name: Obter o IP local da interface de rede no host remoto
    command: hostname -I
    register: ip_output

  - name: Extrair o primeiro IP válido do host remoto
    set_fact:
      host_ip: "{{ ip_output.stdout.split(' ')[0] }}"

  ### BLOCO 3: Criar ou atualizar arquivo .env.mongo-express local
  - name: Garantir que o arquivo .env.mongo-express local existe
    copy:
      dest: "{{ env_file_local_path }}"
      content: ""
      force: no
      mode: '0644'
    delegate_to: localhost
    become: false

  - name: Inserir ou atualizar SERVER_IP no .env.mongo-express local
    lineinfile:
      path: "{{ env_file_local_path }}"
      regexp: '^SERVER_IP='
      line: "SERVER_IP={{ host_ip }}"
      create: yes
      state: present
    delegate_to: localhost
    become: false

  - name: Mostrar conteúdo do arquivo .env.mongo-express após alteração
    shell: cat "{{ env_file_local_path }}"
    register: conteudo_depois
    delegate_to: localhost
    become: false

  - name: Exibir conteúdo do arquivo local
    debug:
      var: conteudo_depois.stdout_lines
    delegate_to: localhost
    become: false

  ### BLOCO 4: Preparação do ambiente remoto (infraestrutura e arquivos)
  - name: Criar diretório para Mongo Express no host remoto
    file:
      path: "{{ gio_directory }}"
      state: directory
      mode: '0755'

  - name: Copiar docker-compose.yml para o diretório remoto
    copy:
      src: "{{ compose_file_src }}"
      dest: "{{ gio_directory }}/{{ compose_file_name }}"
      mode: '0644'

  - name: Copiar .env.mongo-express local para o diretório remoto
    copy:
      src: "{{ env_file_local_path }}"
      dest: "{{ env_file_remote_path }}"
      mode: '0644'

  - name: Remover linhas vazias do .env remoto
    shell: sed -i '/^$/d' "{{ env_file_remote_path }}"

  ### BLOCO 5: Deploy da stack e verificação
  - name: Executar Docker Stack Deploy com .env
    shell: |
      set -a
      . "{{ env_file_remote_path }}"
      set +a
      docker stack deploy -c {{ compose_file_name }} gio_mongo_express
    args:
      chdir: "{{ gio_directory }}"

  - name: Verificar status da stack GIO Mongo Express
    shell: docker stack ps gio_mongo_express
    register: stack_status
    ignore_errors: true

  - name: Exibir status da stack GIO Mongo Express
    debug:
      msg: "{{ stack_status.stdout_lines }}"

  - name: Exibir logs do serviço Mongo Express
    shell: docker service logs -f --tail 50 gio_mongo_express_gio_mongo_express
    register: mongo_express_logs
    async: 60
    poll: 0
    ignore_errors: true

  - name: Mostrar logs do Mongo Express
    debug:
      msg: "{{ mongo_express_logs }}"