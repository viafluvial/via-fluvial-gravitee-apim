---
- name: Desinstalar e limpar configurações da Plataforma GIO Management no Docker Swarm
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/management"

  tasks:

    ### BLOCO 1: Remoção da Stack ###
    - name: Remover stack do Docker para GIO Management
      shell: docker stack rm gio_management
      ignore_errors: true

    - name: Aguardar até que os serviços da stack GIO Management sejam removidos
      shell: |
        until [ -z "$(docker stack services gio_management 2>/dev/null | grep -v NAME)" ]; do
          echo "Aguardando remoção da stack..."
          sleep 5
        done
      args:
        executable: /bin/bash
      register: stack_removal_status
      ignore_errors: true

    - name: Mostrar status da remoção da stack
      debug:
        msg: "{{ stack_removal_status.stdout_lines | default(['Stack removida ou não encontrada.']) }}"

    ### BLOCO 2: Permissões para Deletar ###
    - name: Ajustar permissões para permitir remoção da pasta
      file:
        path: "{{ gio_directory }}"
        state: directory
        recurse: yes
        mode: '0777'
        owner: root
        group: root
      ignore_errors: true

    ### BLOCO 3: Remoção do Diretório ###
    - name: Remover diretório completo da GIO Management
      file:
        path: "{{ gio_directory }}"
        state: absent