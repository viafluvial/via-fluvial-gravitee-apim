---
- name: Instalar e configurar o Navegador Kibana da Plataforma GIO com Docker Stack
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/kibana"
    env_file_local_path: "{{ playbook_dir }}/.env.kibana"
    env_file_remote_path: "{{ gio_directory }}/.env"
    compose_file_name: "docker-compose.yml"
    compose_file_src: "{{ playbook_dir }}/../../../applications/gio/repository/reporitory-gio-kibana-docker-compose.yml"

  tasks:

    ### BLOCO 1: Verificações iniciais ###
    - name: Verificar se Docker está instalado
      command: docker --version
      register: docker_version
      failed_when: docker_version.rc != 0

    - name: Verificar se Docker Swarm está ativo
      command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_state
      failed_when: swarm_state.stdout != "active"

    ### BLOCO 2: Obter IP remoto e atualizar .env.kibana (local) ###
    - name: Obter IP da máquina remota
      command: hostname -I
      register: ip_output

    - name: Extrair primeiro IP válido
      set_fact:
        host_ip: "{{ ip_output.stdout.split(' ')[0] }}"

    - name: Garantir que o arquivo .env.kibana local existe
      copy:
        dest: "{{ env_file_local_path }}"
        content: ""
        force: no
        mode: '0644'
      delegate_to: localhost
      become: false

    - name: Inserir ou atualizar SERVER_IP no .env.kibana local
      lineinfile:
        path: "{{ env_file_local_path }}"
        regexp: '^SERVER_IP='
        line: "SERVER_IP={{ host_ip }}"
        create: yes
        state: present
      delegate_to: localhost
      become: false

    - name: Mostrar conteúdo final do .env.kibana
      shell: cat "{{ env_file_local_path }}"
      register: env_final
      delegate_to: localhost
      become: false

    - name: Debug do .env.kibana final
      debug:
        var: env_final.stdout_lines
      delegate_to: localhost
      become: false

    ### BLOCO 3: Preparar diretório remoto ###
    - name: Criar diretório para Kibana
      file:
        path: "{{ gio_directory }}"
        state: directory
        mode: '0755'

    ### BLOCO 4: Copiar arquivos ###
    - name: Copiar docker-compose.yml com $VAR padrão
      copy:
        src: "{{ compose_file_src }}"
        dest: "{{ gio_directory }}/{{ compose_file_name }}"
        mode: '0644'

    - name: Copiar .env.kibana para o diretório remoto
      copy:
        src: "{{ env_file_local_path }}"
        dest: "{{ env_file_remote_path }}"
        mode: '0644'

    - name: Verificar existência do arquivo .env
      stat:
        path: "{{ gio_directory }}/.env"
      register: env_check

    - name: Exibir resultado da verificação do .env
      debug:
        var: env_check.stat.exists

    ### BLOCO 5: Deploy com Docker Stack ###
    - name: Executar Docker Stack Deploy
      shell: |
        set -a
        . "{{ env_file_remote_path }}"
        set +a
        docker stack deploy -c {{ compose_file_name }} gio_kibana
      args:
        chdir: "{{ gio_directory }}"

    ### BLOCO 6: Verificação e logs ###
    - name: Verificar status da stack GIO Kibana
      shell: docker stack ps gio_kibana
      register: stack_status
      ignore_errors: true

    - name: Exibir status da stack GIO Kibana
      debug:
        msg: "{{ stack_status.stdout_lines }}"

    - name: Exibir logs do serviço GIO Kibana após a implantação
      shell: docker service logs -f --tail 50 gio_kibana_gio_kibana
      register: kibana_logs
      async: 60
      poll: 0
      ignore_errors: true

    - name: Mostrar logs do Kibana
      debug:
        msg: "{{ kibana_logs }}"