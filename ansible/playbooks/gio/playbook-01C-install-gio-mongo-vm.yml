---
- name: Instalar e configurar Banco de dados Mongo da Plataforma GIO com docker stack moderno
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/mongo"
    env_file_local_path: "{{ playbook_dir }}/.env.mongo"
    env_file_remote_path: "{{ gio_directory }}/.env"
    compose_file_name: "docker-compose.yml"
    compose_file_src: "{{ playbook_dir }}/../../../applications/gio/repository/repository-gio-mongo-docker-compose.yml"

  tasks:

    ### BLOCO 1: Verificações iniciais ###
    - name: Verificar se Docker está instalado
      command: docker --version
      register: docker_version
      failed_when: docker_version.rc != 0

    - name: Verificar se Docker Swarm está ativo
      command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_state
      failed_when: swarm_state.stdout != "active"

    ### BLOCO 2: Obter IP do host remoto e preparar .env.local ###
    - name: Obter IP da máquina remota
      command: hostname -I
      register: ip_output

    - name: Extrair primeiro IP válido da máquina remota
      set_fact:
        host_ip: "{{ ip_output.stdout.split(' ')[0] }}"

    - name: Garantir que o arquivo .env.mongo local existe
      copy:
        dest: "{{ env_file_local_path }}"
        content: ""
        force: no
        mode: '0644'
      delegate_to: localhost
      become: false

    - name: Inserir ou atualizar SERVER_IP no .env.mongo local
      lineinfile:
        path: "{{ env_file_local_path }}"
        regexp: '^SERVER_IP='
        line: "SERVER_IP={{ host_ip }}"
        create: yes
        state: present
      delegate_to: localhost
      become: false

    - name: Exibir conteúdo final do .env.mongo local
      shell: cat "{{ env_file_local_path }}"
      register: env_final
      delegate_to: localhost
      become: false

    - name: Debug do .env final (local)
      debug:
        var: env_final.stdout_lines
      delegate_to: localhost
      become: false

    ### BLOCO 3: Estrutura de diretórios e arquivos no host remoto ###
    - name: Criar diretórios para Mongo
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ gio_directory }}"
        - "{{ gio_directory }}/data"
        - "{{ gio_directory }}/logs"

    - name: Copiar docker-compose.yml (com $VAR no template)
      copy:
        src: "{{ compose_file_src }}"
        dest: "{{ gio_directory }}/{{ compose_file_name }}"
        mode: '0644'

    - name: Copiar .env.mongo local para o diretório remoto
      copy:
        src: "{{ env_file_local_path }}"
        dest: "{{ env_file_remote_path }}"
        mode: '0644'

    - name: Verificar existência do arquivo .env remoto
      stat:
        path: "{{ gio_directory }}/.env"
      register: env_check

    - name: Exibir resultado da verificação do .env remoto
      debug:
        var: env_check.stat.exists

    ### BLOCO 4: Deploy do serviço com Docker Stack ###
    - name: Executar docker stack deploy com docker-compose.yml e .env
      shell: |
        set -a
        . "{{ env_file_remote_path }}"
        set +a
        docker stack deploy -c {{ compose_file_name }} gio_mongo
      args:
        chdir: "{{ gio_directory }}"

    ### BLOCO 5: Verificações pós-deploy ###
    - name: Verificar status da stack GIO Mongo
      shell: docker stack ps gio_mongo
      register: stack_status
      ignore_errors: true

    - name: Exibir status da stack GIO Mongo
      debug:
        msg: "{{ stack_status.stdout_lines }}"

    - name: Exibir logs do serviço GIO Mongo após a implantação
      shell: docker service logs -f --tail 50 gio_mongo_gio_mongo
      register: gio_mongo_logs
      async: 60
      poll: 0
      ignore_errors: true

    - name: Exibir logs do GIO Mongo
      debug:
        msg: "{{ gio_mongo_logs }}"