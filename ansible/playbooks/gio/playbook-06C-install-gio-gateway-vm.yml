---
- name: Instalar e configurar a Plataforma GIO Gateway com Docker Compose moderno
  hosts: all
  become: true

  vars:
    gio_directory: "/opt/service-center/gio/gateway"
    env_file_local_path: "{{ playbook_dir }}/.env.gateway"
    env_file_remote_path: "{{ gio_directory }}/.env"
    compose_file_name: "docker-compose.yml"
    compose_file_src: "{{ playbook_dir }}/../../../applications/gio/api/gateway/gateway-gio-docker-compose.yml"

  tasks:

  ### BLOCO 1: Verificações iniciais no host remoto
  - name: Verificar se Docker está instalado
    command: docker --version
    register: docker_version
    failed_when: docker_version.rc != 0

  - name: Verificar se Docker Swarm está ativo
    command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
    register: swarm_state
    failed_when: swarm_state.stdout != "active"

  ### BLOCO 2: Obter IP do host remoto
  - name: Obter o IP local da interface de rede no host remoto
    command: hostname -I
    register: ip_output

  - name: Extrair o primeiro IP válido do host remoto
    set_fact:
      host_ip: "{{ ip_output.stdout.split(' ')[0] }}"


  ### BLOCO 3: Preparar o arquivo .env.management localmente      
  - name: Garantir que o arquivo .env.gateway local existe
    copy:
      dest: "{{ env_file_local_path }}"
      content: ""
      force: no
      mode: '0644'
    delegate_to: localhost
    become: false

  - name: Inserir ou atualizar SERVER_IP no .env.gateway local
    lineinfile:
      path: "{{ env_file_local_path }}"
      regexp: '^SERVER_IP='
      line: "SERVER_IP={{ host_ip }}"
      create: yes
      state: present
    delegate_to: localhost
    become: false

  - name: Mostrar conteúdo atualizado do .env.gateway local
    shell: cat "{{ env_file_local_path }}"
    register: conteudo_env
    delegate_to: localhost
    become: false

  - name: Exibir conteúdo do .env.gateway local
    debug:
      var: conteudo_env.stdout_lines
    delegate_to: localhost
    become: false

  ### BLOCO 4: Preparação do ambiente remoto
  - name: Criar diretórios da GIO Gateway
    file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
    loop:
      - "{{ gio_directory }}"
      - "{{ gio_directory }}/api-gateway/logs"

  - name: Copiar docker-compose.yml para o host remoto
    copy:
      src: "{{ compose_file_src }}"
      dest: "{{ gio_directory }}/{{ compose_file_name }}"
      mode: '0644'

  - name: Copiar arquivo de log de exemplo
    copy:
      src: "{{ playbook_dir }}/../../../applications/gio/api/gateway/api-gateway/logs/error.log"
      dest: "{{ gio_directory }}/api-gateway/logs/error.log"
      mode: '0644'

  - name: Copiar .env.gateway local para o host remoto
    copy:
      src: "{{ env_file_local_path }}"
      dest: "{{ env_file_remote_path }}"
      mode: '0644'

  ### BLOCO 5: Deploy da stack com validações
  - name: Verificar existência do arquivo .env no host remoto
    stat:
      path: "{{ env_file_remote_path }}"
    register: env_check

  - name: Exibir resultado da verificação do .env
    debug:
      var: env_check.stat.exists

  - name: Executar docker stack deploy com variáveis do .env carregadas
    shell: |
      set -a
      . "{{ env_file_remote_path }}"
      set +a
      docker stack deploy -c {{ compose_file_name }} gio_gateway
    args:
      chdir: "{{ gio_directory }}"

  ### BLOCO 6: Verificações finais
  - name: Verificar status dos containers GIO Gateway
    shell: docker compose -f {{ compose_file_name }} ps
    args:
      chdir: "{{ gio_directory }}"
    register: stack_status
    ignore_errors: true

  - name: Exibir containers da stack GIO Gateway
    debug:
      msg: "{{ stack_status.stdout_lines }}"