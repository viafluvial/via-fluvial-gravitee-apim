---
- name: Instalar/atualizar stack Management via Portainer API
  hosts: all
  become: true

  vars:
    network_name: "service-public"
    gio_directory: "/opt/service-center/gio/management"
    deployment_environment: "{{ lookup('env', 'ENVIRONMENT') | default('prd', true) }}"
    gio_cluster_env_resolved: "{{ deployment_environment if deployment_environment in ['dsv', 'hml'] else '' }}"

  tasks:
    - name: Verificar se Docker está instalado
      command: docker --version
      register: docker_version
      failed_when: docker_version.rc != 0

    - name: Verificar se Docker Swarm está ativo
      command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_state
      failed_when: swarm_state.stdout != "active"

    - name: Verificar se a rede overlay externa existe
      command: docker network inspect "{{ network_name }}"
      register: network_check
      changed_when: false
      failed_when: false

    - name: Garantir que a rede está disponível antes de prosseguir
      fail:
        msg: "A rede {{ network_name }} não existe. Crie-a no Swarm (ex.: traefik/cluster base) antes de instalar o GIO."
      when: network_check.rc != 0

    - name: Criar estrutura de diretórios para GIO Management
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ gio_directory }}"
        - "{{ gio_directory }}/api-console/config"
        - "{{ gio_directory }}/api-console/logs"
        - "{{ gio_directory }}/api-console/templates"
        - "{{ gio_directory }}/api-console/plugins"
        - "{{ gio_directory }}/console/logs"
        - "{{ gio_directory }}/portal/logs"

    - name: Copiar compose do Management
      copy:
        src: "{{ playbook_dir }}/../../../applications/gio/api/management/management-gio-docker-compose.yml"
        dest: "{{ gio_directory }}/docker-compose.yml"
        mode: '0644'

    - name: Copiar .env do Management
      copy:
        src: "{{ playbook_dir }}/.env.management"
        dest: "{{ gio_directory }}/.env"
        mode: '0644'

    - name: Remover linhas vazias do .env (Management)
      shell: "sed -i '/^$/d' {{ gio_directory }}/.env"
      changed_when: true

    - name: Ajustar clusters no .env (Management) em dsv/hml
      lineinfile:
        path: "{{ gio_directory }}/.env"
        regexp: "^{{ item }}="
        line: "{{ item }}={{ gio_cluster_env_resolved }}"
      loop:
        - GIO_ELASTICSEARCH_CLUSTER
        - GIO_API_CONSOLE_CLUSTER
        - GIO_PORTAL_CLUSTER
        - GIO_CONSOLE_CLUSTER
      when: gio_cluster_env_resolved | length > 0

    - name: Copiar arquivos de log de exemplo
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: "{{ playbook_dir }}/../../../applications/gio/api/management/api-console/logs/error.log", dest: "{{ gio_directory }}/api-console/logs/error.log" }
        - { src: "{{ playbook_dir }}/../../../applications/gio/api/management/console/logs/error.log", dest: "{{ gio_directory }}/console/logs/error.log" }
        - { src: "{{ playbook_dir }}/../../../applications/gio/api/management/portal/logs/error.log", dest: "{{ gio_directory }}/portal/logs/error.log" }
      ignore_errors: true

    - name: Copiar templates de e-mail do APIM (api-console)
      copy:
        src: "{{ playbook_dir }}/../../../applications/gio/api/management/api-console/templates/"
        dest: "{{ gio_directory }}/api-console/templates/"
        mode: '0644'
        directory_mode: '0755'

    - name: Deploy stack gio_management via Portainer API
      include_tasks: ./tasks/portainer-deploy-stack.yml
      vars:
        portainer_stack_name: "gio_management"
        portainer_compose_path: "{{ gio_directory }}/docker-compose.yml"
        portainer_env_path: "{{ gio_directory }}/.env"
        portainer_recreate_existing_stack: true
