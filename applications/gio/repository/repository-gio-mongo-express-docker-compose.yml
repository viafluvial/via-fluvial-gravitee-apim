version: '3.9'

services: 
  mongo-express:
    image: mongo-express:${GIO_MONGO_EXPRESS_VERSION}
    ports:
      - "8081:8081"
      
    environment:
      - TZ=America/Manaus

      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_URL=mongodb://${GIO_MONGO_ROOT_USERNAME}:${GIO_MONGO_ROOT_PASSWORD}@${GIO_MONGO_HOST}:27017/admin?authSource=admin

      - ME_CONFIG_BASICAUTH_USERNAME=${GIO_MONGO_EXPRESS_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${GIO_MONGO_EXPRESS_PASSWORD}

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s 
      placement:
        constraints: [node.role == manager]

      labels:
        #General
        - traefik.enable=true
        - traefik.network=service-public
        - traefik.constraint-label=service-public
        - traefik.docker.network=service-public

        #HTTP
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-http.rule=Host(`${GIO_MONGO_EXPRESS_APPLICATION}.${GIO_MONGO_EXPRESS_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-http.entrypoints=http
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-http.middlewares=https-redirect
        
        #HTTPSp
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-https.rule=Host(`${GIO_MONGO_EXPRESS_APPLICATION}.${GIO_MONGO_EXPRESS_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-https.entrypoints=https
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-https.tls=true
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-https.tls.certresolver=letsencrypt
        
        #Service
        - traefik.http.routers.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}-https.service=gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}

        #Load Balance
        - traefik.http.services.gio-mongo-express-${GIO_MONGO_EXPRESS_CLUSTER}.loadbalancer.server.port=8081
  
    networks:
      - service-public

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"       

networks:
  service-public:
    external: true
    name: service-public