version: '3.9'

services:
  
  api-console:
    image: graviteeio/apim-management-api:${GIO_APIM_VERSION}
   
    restart: always
    
    ports:
      - "8083:8083"

    volumes:    
      - "/opt/service-center/gio/management/api-console/plugins:/opt/graviteeio-management-api/plugins-ext"
      - "/opt/service-center/gio/management/api-console/templates:/opt/graviteeio-management-api/templates:ro"
      
    environment:
      - TZ=America/Manaus

      - gravitee_management_mongodb_uri=mongodb://${GIO_MONGO_USERNAME}:${GIO_MONGO_PASSWORD}@${GIO_MONGO_HOST}/gravitee?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
      - gravitee_ratelimit_mongodb_uri=mongodb://${GIO_MONGO_USERNAME}:${GIO_MONGO_PASSWORD}@${GIO_MONGO_HOST}/gravitee?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
      - gravitee_installation_standalone_portal_url=${GIO_PORTAL_UI_URL}

      - gravitee_analytics_elasticsearch_endpoints_0=http://${GIO_ELASTICSEARCH_HOST}:9200
      - gravitee_analytics_elasticsearch_security_username=${GIO_ELASTICSEARCH_USERNAME}
      - gravitee_analytics_elasticsearch_security_password=${GIO_ELASTICSEARCH_PASSWORD}

      - gravitee_reporters_elasticsearch_endpoints_0=http://${GIO_ELASTICSEARCH_HOST}:9200
      - gravitee_reporters_elasticsearch_security_username=${GIO_ELASTICSEARCH_USERNAME}
      - gravitee_reporters_elasticsearch_security_password=${GIO_ELASTICSEARCH_PASSWORD}

      - gravitee_plugins_path_0=/opt/graviteeio-management-api/plugins
      - gravitee_plugins_path_1=/opt/graviteeio-management-api/plugins-ext
      
      - gravitee_email_enabled=True
      - gravitee_email_host=${GIO_SMTP_HOST}
      - gravitee_email_port=${GIO_SMTP_PORT}
      - gravitee_email_from=${GIO_SMTP_FROM}
      #- gravitee_email_username=${GIO_SMTP_USER}
      #- gravitee_email_password=${GIO_SMTP_PASSWORD}
   
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s 
      placement:
        constraints: [node.role == manager]
        
      labels:
        #General
        - traefik.enable=true
        - traefik.network=service-public
        - traefik.constraint-label=service-public
        - traefik.docker.network=service-public
        
        #HTTP
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-http.rule=Host(`${GIO_API_CONSOLE_APPLICATION}.${GIO_API_CONSOLE_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-http.entrypoints=http
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-http.middlewares=https-redirect
        
        #HTTPS
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-https.rule=Host(`${GIO_API_CONSOLE_APPLICATION}.${GIO_API_CONSOLE_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-https.entrypoints=https
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-https.tls=true
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-https.tls.certresolver=letsencrypt
        
        #Service
        - traefik.http.routers.gio-api-console-${GIO_API_CONSOLE_CLUSTER}-https.service=gio-api-console-${GIO_API_CONSOLE_CLUSTER}

        #Load Balance
        - traefik.http.services.gio-api-console-${GIO_API_CONSOLE_CLUSTER}.loadbalancer.server.port=8083
      
    networks:
      - service-public

  console:
    image: graviteeio/apim-management-ui:${GIO_APIM_VERSION}
  
    restart: always  

    depends_on:
      - api-console
          
    environment:
      - TZ=America/Manaus
      
      - MGMT_API_URL=${GIO_MANAGEMENT_API_URL}/management/organizations/DEFAULT/environments/DEFAULT/
    
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s 
      placement:
        constraints: [node.role == manager]
        
      labels:
        #General
        - traefik.enable=true
        - traefik.network=service-public
        - traefik.constraint-label=service-public
        - traefik.docker.network=service-public
        
        #HTTP
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-http.rule=Host(`${GIO_CONSOLE_APPLICATION}.${GIO_CONSOLE_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-http.entrypoints=http
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-http.middlewares=https-redirect
        
        #HTTPS
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-https.rule=Host(`${GIO_CONSOLE_APPLICATION}.${GIO_CONSOLE_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-https.entrypoints=https
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-https.tls=true
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-https.tls.certresolver=letsencrypt
        
        #Service
        - traefik.http.routers.gio-console-${GIO_CONSOLE_CLUSTER}-https.service=gio-console-${GIO_CONSOLE_CLUSTER}

        #Load Balance
        - traefik.http.services.gio-console-${GIO_CONSOLE_CLUSTER}.loadbalancer.server.port=8080

    networks:
      - service-public

  portal:
    image: ${GIO_PORTAL_UI_IMAGE}

    restart: always
    
    depends_on:
      - api-console
      
    environment:
      - TZ=America/Manaus
      
      - PORTAL_API_URL=${GIO_MANAGEMENT_API_URL}/portal/environments/DEFAULT
      
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s 
      placement:
        constraints: [node.role == manager]

      labels:
        #General
        - traefik.enable=true
        - traefik.network=service-public
        - traefik.constraint-label=service-public
        - traefik.docker.network=service-public
        
        #HTTP
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-http.rule=Host(`${GIO_PORTAL_APPLICATION}.${GIO_PORTAL_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-http.entrypoints=http
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-http.middlewares=https-redirect
        
        #HTTPSp
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-https.rule=Host(`${GIO_PORTAL_APPLICATION}.${GIO_PORTAL_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-https.entrypoints=https
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-https.tls=true
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-https.tls.certresolver=letsencrypt
        
        #Service
        - traefik.http.routers.gio-portal-${GIO_PORTAL_CLUSTER}-https.service=gio-portal-${GIO_PORTAL_CLUSTER}

        #Load Balance
        - traefik.http.services.gio-portal-${GIO_PORTAL_CLUSTER}.loadbalancer.server.port=8080
    
    networks:
      - service-public   

networks:
  service-public:
    driver: overlay
    external: true
    name: service-public