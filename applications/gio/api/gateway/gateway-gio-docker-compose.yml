version: '3.9'

services:

  api-gateway:
    image: graviteeio/apim-gateway:${GIO_APIM_VERSION}

    restart: always
    
    ports:
      - "8082:8082"
    
    volumes:
      - "/opt/service-center/gio/gateway/api-gateway/logs:/opt/graviteeio-gateway/logs"

    # Backends da plataforma pelo IP interno do Traefik de cada cluster (sem ida e volta pelo load balancer
    # publico). Lista gerada do catalogo do via-fluvial-services (api_public_fqdn) + SSO do cluster identity.
    extra_hosts:
      - "api-acervo-digital.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-administracao.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-auditoria.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-avaliacoes-experiencia.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-compliance.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-embarcacoes.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-engenharia-operacoes.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-financeiro.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-fretes-cargas.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-identidade-autenticacao.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-notificacoes.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-operacoes-agencia.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-pagamentos.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-perfis-usuarios.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-relatorios.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-reservas.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-rotas-portos.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-suporte.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-ticket-suporte.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-tripulacao.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-venda-ingressos.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "api-viagens.api.plataforma.prd.viafluvial.com.br:10.60.4.18"
      - "sso.identity.plataforma.prd.viafluvial.com.br:10.60.4.21"
    
    environment:
      - TZ=America/Manaus
      
      - gravitee_management_mongodb_uri=mongodb://${GIO_MONGO_USERNAME}:${GIO_MONGO_PASSWORD}@${GIO_MONGO_HOST}/gravitee?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
      - gravitee_ratelimit_mongodb_uri=mongodb://${GIO_MONGO_USERNAME}:${GIO_MONGO_PASSWORD}@${GIO_MONGO_HOST}/gravitee?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
      
      - gravitee_reporters_elasticsearch_endpoints_0=http://${GIO_ELASTICSEARCH_HOST}:9200
      - gravitee_reporters_elasticsearch_security_username=${GIO_ELASTICSEARCH_USERNAME}
      - gravitee_reporters_elasticsearch_security_password=${GIO_ELASTICSEARCH_PASSWORD}
       
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s 
      placement:
        constraints: [node.role == manager]

      labels:
        #General
        - traefik.enable=true
        - traefik.network=service-public
        - traefik.constraint-label=service-public
        - traefik.docker.network=service-public
        
        #HTTP
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-http.rule=Host(`${GIO_API_GATEWAY_APPLICATION}.${GIO_API_GATEWAY_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-http.entrypoints=http
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-http.middlewares=https-redirect
        
        #HTTPSp
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-https.rule=Host(`${GIO_API_GATEWAY_APPLICATION}.${GIO_API_GATEWAY_CLUSTER}.${GIO_DOMAIN_BASE}`)
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-https.entrypoints=https
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-https.tls=true
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-https.tls.certresolver=letsencrypt
        
        #Service
        - traefik.http.routers.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}-https.service=gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}

        #Load Balance
        - traefik.http.services.gio-api-gateway-${GIO_API_GATEWAY_CLUSTER}.loadbalancer.server.port=8082

    networks:
      - service-public

networks:
  service-public:
    external: true
    name: service-public